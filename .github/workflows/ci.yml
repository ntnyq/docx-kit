name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run docs:verify

  test:
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: lts/*
            visual: true
          - os: windows-latest
            node: current
            visual: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - if: matrix.visual
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          fonts-liberation libreoffice-writer poppler-utils
      - if: matrix.visual
        run: pnpm run visual:check
      - if: failure() && matrix.visual
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: output/visual-regression/
          retention-days: 14
